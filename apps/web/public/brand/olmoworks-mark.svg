<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 260 545 580" width="100%" height="100%">
  <defs>
    <!-- Peach-to-Rose vertical gradient for the totem body -->
    <linearGradient id="peachRoseTotem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDAB9" />
      <stop offset="45%" stop-color="#FFB09C" />
      <stop offset="75%" stop-color="#F47C90" />
      <stop offset="100%" stop-color="#C2496E" />
    </linearGradient>

    <!-- Mask to hide the back half of the ring behind the totem with the softened tip -->
    <mask id="backMask">
      <rect width="600" height="1060" fill="#ffffff" />
      <path fill="#000000" d="
        M 300, 275
        C 313, 275  324, 285  324, 305
        L 324, 385
        C 324, 430  350, 475  400, 500
        C 438, 519  462, 532  464, 545
        C 466, 558  445, 574  410, 600
        C 358, 638  324, 730  304, 825
        C 302, 831  298, 831  296, 825
        C 276, 730  242, 638  190, 600
        C 155, 574  134, 558  136, 545
        C 138, 532  162, 519  200, 500
        C 250, 475  276, 430  276, 385
        L 276, 305
        C 276, 285  287, 275  300, 275
        Z
      " />
    </mask>

    <!-- Clip plane aligned to the -8° tilt axis to cleanly isolate the front half of the ring -->
    <clipPath id="frontClip">
      <rect x="-300" y="0" width="600" height="520" />
    </clipPath>
  </defs>

  <!-- ================= 1. BACK SEGMENTS OF THE RING (TWIN ORBITS) ================= -->
  <g mask="url(#backMask)">
    <g transform="translate(300, 540) rotate(-8)">
      <ellipse cx="0" cy="0" rx="225" ry="58" fill="none" stroke="#E05375" stroke-width="8" />
      <ellipse cx="0" cy="0" rx="255" ry="66" fill="none" stroke="#E05375" stroke-width="6" opacity="0.55" />
    </g>
  </g>

  <!-- ================= 2. TOTEM BODY (SOFTENED/HUMANIZED TIP) ================= -->
  <path fill="url(#peachRoseTotem)" d="
    M 300, 275
    C 313, 275  324, 285  324, 305
    L 324, 385
    C 324, 430  350, 475  400, 500
    C 438, 519  462, 532  464, 545
    C 466, 558  445, 574  410, 600
    C 358, 638  324, 730  304, 825
    C 302, 831  298, 831  296, 825
    C 276, 730  242, 638  190, 600
    C 155, 574  134, 558  136, 545
    C 138, 532  162, 519  200, 500
    C 250, 475  276, 430  276, 385
    L 276, 305
    C 276, 285  287, 275  300, 275
    Z
  " />

  <!-- ================= 3. FRONT SEGMENTS OF THE RING (TWIN ORBITS) ================= -->
  <g transform="translate(300, 540) rotate(-8)">
    <g clip-path="url(#frontClip)">
      <ellipse cx="0" cy="0" rx="225" ry="58" fill="none" stroke="#E05375" stroke-width="8" />
      <ellipse cx="0" cy="0" rx="255" ry="66" fill="none" stroke="#E05375" stroke-width="6" opacity="0.55" />
    </g>
  </g>
</svg>
